# version: '3.4'

services:
  qrcode2call-ng:
    image: qrcode2call-ng
    restart: unless-stopped
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: ./Dockerfile

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/qrcode2call/Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
